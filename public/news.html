<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 뉴스</title>
  <meta name="description" content="수질·환경·과학·기술 분야의 최신 뉴스를 모아 보여주는 페이지">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/news.css">
</head>
<body>

  <!-- 1. 맨 위 제목 영역 -->
  <header class="news-hero">
    <div class="wrap">
      <a class="back-link" href="/"><i class="bi bi-arrow-left"></i> 메인으로</a>
      <h1><i class="bi bi-newspaper"></i> 오늘의 뉴스</h1>
      <p>수질·환경부터 과학·기술까지, 최신 기사를 한눈에 모아봤어요.</p>
    </div>
  </header>

  <main class="wrap">
    <!-- 2. 주제 탭 + 검색 -->
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="뉴스 주제">
        <button class="tab" role="tab" data-topic="water-ko">💧 수질·물</button>
        <button class="tab" role="tab" data-topic="env-ko">🌱 환경·기후</button>
        <button class="tab" role="tab" data-topic="water-en">🌍 Water (영문)</button>
        <button class="tab" role="tab" data-topic="science">🔬 Science</button>
        <button class="tab" role="tab" data-topic="tech">💻 Tech</button>
      </div>
      <form class="search" id="search-form" role="search">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input id="search-input" type="search" maxlength="50" placeholder="한국어 기사 검색 (예: 정수장)" aria-label="뉴스 검색어">
        <button type="submit">검색</button>
      </form>
    </div>

    <!-- 3. 상태 안내 (불러오는 중 / 결과 개수 / 오류) -->
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <!-- 4. 뉴스 카드 목록 (js/news.js가 채움) -->
    <div class="grid" id="news-grid"></div>
  </main>

  <footer>
    <div class="wrap">뉴스 제공: <a href="https://newsapi.org" target="_blank" rel="noopener">NewsAPI.org</a></div>
  </footer>

  <script src="js/news.js"></script>
</body>
</html>
