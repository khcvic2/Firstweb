<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날씨 지도</title>
  <meta name="description" content="지역을 검색하거나 지도에서 선택해 현재 날씨와 5일 예보를 확인하는 페이지">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/weather.css">
</head>
<body>

  <!-- 1. 맨 위 제목 영역 -->
  <header class="wx-hero">
    <div class="wrap">
      <a class="back-link" href="/"><i class="bi bi-arrow-left"></i> 메인으로</a>
      <h1><i class="bi bi-cloud-sun"></i> 날씨 지도</h1>
      <p>지역 이름을 검색하거나 지도를 눌러 현재 날씨와 5일 예보를 확인하세요.</p>
    </div>
  </header>

  <main class="wrap layout">
    <!-- 2. 왼쪽: 검색 + 빠른 선택 + 지도 -->
    <section class="panel map-panel" aria-label="지역 선택">
      <form class="search" id="search-form" role="search">
        <i class="bi bi-geo-alt" aria-hidden="true"></i>
        <input id="search-input" type="search" maxlength="50" placeholder="지역 이름 (예: 인천, Busan, Tokyo)" aria-label="지역 이름">
        <button type="submit">검색</button>
      </form>
      <div class="chips" id="chips" aria-label="주요 도시 빠른 선택"></div>
      <div id="map" class="map" role="application" aria-label="지도: 원하는 위치를 누르세요"></div>
      <p class="hint"><i class="bi bi-hand-index"></i> 지도에서 원하는 곳을 누르면 그 위치의 날씨를 보여줘요.</p>
    </section>

    <!-- 3. 오른쪽: 날씨 결과 -->
    <section class="results" aria-live="polite">
      <p class="status" id="status" role="status"></p>

      <article class="panel current" id="current" hidden>
        <div class="current-top">
          <div>
            <h2 class="place" id="place"></h2>
            <p class="updated" id="updated"></p>
          </div>
          <img class="current-icon" id="current-icon" alt="">
        </div>
        <div class="current-main">
          <span class="temp" id="temp"></span>
          <div>
            <p class="desc" id="desc"></p>
            <p class="range" id="range"></p>
          </div>
        </div>
        <dl class="details" id="details"></dl>
      </article>

      <article class="panel" id="hourly-panel" hidden>
        <h3 class="panel-title"><i class="bi bi-clock"></i> 앞으로 24시간</h3>
        <div class="hourly" id="hourly"></div>
      </article>

      <article class="panel" id="daily-panel" hidden>
        <h3 class="panel-title"><i class="bi bi-calendar-week"></i> 일별 예보 <small>(최대 5일)</small></h3>
        <ol class="daily" id="daily"></ol>
      </article>
    </section>
  </main>

  <footer>
    <div class="wrap">날씨 제공: <a href="https://openweathermap.org" target="_blank" rel="noopener">OpenWeatherMap</a> · 지도: <a href="https://map.kakao.com" target="_blank" rel="noopener">카카오맵</a></div>
  </footer>

  <!-- 카카오맵 프로그램은 js/weather.js가 서버에서 키를 받아 불러옵니다 -->
  <script src="js/weather.js"></script>
</body>
</html>
