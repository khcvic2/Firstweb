# ===========================================
# Netlify 배포 설정 파일 (netlify.toml)
# ===========================================

[build]
  # 배포할 폴더: public 폴더 안의 파일만 인터넷에 공개됩니다.
  # (.env, .gitignore, netlify.toml 등 바깥 파일은 공개되지 않음)
  publish = "public"

[functions]
  # 서버 코드(카카오 로그인 처리) 위치 - 공개되지 않고 Netlify 서버에서만 실행됨
  directory = "netlify/functions"

[dev]
  # 내 컴퓨터 테스트 설정 (npm run dev 또는 netlify dev)
  framework = "#static"
  port = 8888
